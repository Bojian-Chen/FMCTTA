[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmctta"
version = "0.1.0"
description = "Continual test-time adaptation for UniFreq, UniFault, and TF-ProFM"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
  "h5py>=3.8",
  "huggingface-hub>=0.20",
  "safetensors>=0.4",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["fmctta*", "ctta_data_builder*"]

[tool.setuptools.package-data]
ctta_data_builder = ["README_zh.md", "configs/*.json", "configs/octta/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py39"
