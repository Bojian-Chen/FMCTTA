# PU 1024-point dataset profile (64,000 Hz, 0.016 s per sample), migrated
# from OCTTA. Run from the repository root so the manifest path resolves.

protocol:
  # Domain 0 is the labeled source; domain 1 repeats seven times before domains 2 and 3.
  domains: [0, 2, 3, 2, 3, 2, 3,  2, 3,  2, 3,  2, 3]
  # shuffled: mix all selected samples; class_block: finish one class before the next; interleaved: take classes in round-robin order (A1, B1, C1, A2, B2, C2 for three classes with two samples each).
  stream_order: shuffled # ["shuffled", "class_block", "interleaved"]
  stream_batch_size: 16
  seed: 2025

data:
  dataset_manifest: data/ctta_custom/PU_1024point_custom.json
  # dataset and data_root are intentionally absent because dataset_manifest supplies the dynamic DatasetSpec and its data directory.
  normalization: none # ["zscore", "minmax", "none"]
  source_validation_ratio: 0.2
  strict_data: false # [false, true]
  max_source_per_class: null
  max_target_per_domain: null
  # Domain 1 repeats in this stream; each occurrence independently selects from its full class pool, so the same target samples may recur.
  allow_repeated_target_samples: true # [false, true]
  # The 1024-point manifest provides 4860 samples per class/domain. This
  # protocol deliberately selects 200; source selection must match checkpoints.
  source_samples_per_class: 200
  target_samples_per_class: 200
  # Per-class example (14 values, in manifest class order); replace the scalar above with this form when classes need different source allocations:
  # source_samples_per_class: [200, 180, 160, 140, 120, 100, 100, 100, 100, 100, 100, 100, 100, 100]
  # Use a nested list for target per-class allocation; one inner list is reused for every target-domain occurrence, while the outer list prevents interpreting values as counts for different target positions.
  # target_samples_per_class: [[200, 180, 160, 140, 120, 100, 100, 100, 100, 100, 100, 100, 100, 100]]
  # Advanced: `;` separates PU's nine target-stream positions, while `,` separates its 14 classes; a scalar entry applies to all classes in that target position:
  # target_samples_per_class: "200;200;200;200;200;200;200;150;100"
  # Per-position AND per-class allocation needs nine semicolon-separated entries, one for every target-stream position.
  # target_samples_per_class: >-
  #   200,180,160,140,120,100,100,100,100,100,100,100,100,100;
  #   150,140,130,120,110,100,100,100,100,100,100,100,100,100;
  #   100,100,100,100,100,100,100,100,100,100,100,100,100,100

model:
  model_id: bojian1/UniFreq-tiny
  model_revision: ""
  # hf_token is intentionally not stored in versioned YAML; inject it securely at runtime only for a private Hugging Face model.
  cache_dir: ""
  local_files_only: false # [false, true]
  # UniFreq's global-FFT frequency branch is the primary classifier path.
  feature_branch: frequency # ["fused", "time", "frequency"]
  # Inherited by every target-domain baseline/adaptation configuration.
  source_checkpoint: outputs/PU_1024point_custom/source/pu-source-seed2025/source_checkpoint
  classifier: mlp # ["mlp", "linear", "cosine"]
  classifier_dropout: 0.0
  source_epochs: 30
  source_batch_size: 64
  eval_batch_size: 128
  source_learning_rate: 0.01
  source_backbone_lr_scale: 0.01
  source_weight_decay: 0.0001
  source_gradient_clip: 1.0

adaptation:
  adaptation_learning_rate: 0.0025
  adaptation_weight_decay: 0.0
  adaptation_steps: 1
  adaptation_parameter_scope: default # ["default", "layernorm", "classifier", "backbone", "all"]

runtime:
  device: auto
  workers: 0
  output_dir: outputs
