# Run: python main.py --config configs/PU/tca.yaml
base: base.yaml

protocol:
  method: tca

adaptation:
  adaptation_learning_rate: 0.001
  adaptation_parameter_scope: all
  tca_teacher_momentum: 0.999
  tca_centroid_momentum: 0.9
  tca_topology_weight_momentum: 0.8
  tca_alignment_weight: 0.025
  tca_topology_weight: 0.15
  tca_uniformity_temperature: 2.0
  tca_symmetric_alpha: 0.5

runtime:
  run_name: pu-tca

