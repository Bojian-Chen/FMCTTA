# Run with:
# python main.py --config configs/experiments/tent_frequency_repeated.yaml
# Any command-line option can override this file or its base configuration.
base: ../base.yaml

# The first domain is the labeled source. Targets may repeat.
protocol:
  domains: [0, 1, 2, 3, 1, 3, 2, 3]
  method: tent

data:
  # One value applies to every class. Use a list, e.g. [60, 50, 60, 50, 60],
  # configures the five PU_Real classes separately.
  source_samples_per_class: 60
  # One value applies to every target-stream occurrence and every class.
  # Domains 1/2/3 consume 40/40/60 distinct samples per class respectively.
  target_samples_per_class: 20

model:
  feature_branch: frequency

adaptation:
  # Explicitly retain TENT's default LayerNorm-only update scope.
  adaptation_parameter_scope: layernorm

runtime:
  run_name: tent-frequency-repeated
