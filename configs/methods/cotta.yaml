# Shared CoTTA protocol.
protocol:
  method: cotta

adaptation:
  adaptation_parameter_scope: all
  cotta_teacher_momentum: 0.999
  cotta_restore_probability: 0.01
  cotta_anchor_threshold: 0.92
  cotta_augmentations: 8
  cotta_augmentation_noise_std: 0.005
  cotta_augmentation_scale_std: 0.05
  cotta_augmentation_mask_probability: 0.0
  cotta_augmentation_shift_ratio: 0.0

