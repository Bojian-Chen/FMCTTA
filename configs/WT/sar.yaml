# Run after configs/WT/source.yaml.
base: base.yaml

protocol:
  method: sar # ["source", "knn", "tent", "eata", "sar", "cotta", "vida", "continual_mae"]

adaptation:
  adaptation_parameter_scope: layernorm # ["default", "layernorm", "classifier", "backbone", "all"]
  sar_rho: 0.05
  sar_entropy_margin: null
  sar_reset_threshold: 0.2
  sar_ema_momentum: 0.9

runtime:
  run_name: wt-sar
