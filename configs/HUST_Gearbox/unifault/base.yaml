# HUST_Gearbox + UniFault-small; inherits the dataset stream and training protocol.
base: ../base.yaml

data:
  # PHMFD preprocessing is applied by the model wrapper; avoid double normalization.
  normalization: none

model:
  foundation_model: unifault
  foundation_model_size: small
  pretrained_checkpoint: auto
  model_input_length: 0
  model_input_normalization: auto
  feature_branch: fused
  source_checkpoint: outputs/HUST_Gearbox_0p1s_custom/source/hust-gearbox-unifault-small-source-seed2025/source_checkpoint
