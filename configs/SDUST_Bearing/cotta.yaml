# Run: python main.py --config configs/SDUST_Bearing/cotta.yaml
base: base.yaml

protocol:
  method: cotta

adaptation:
  adaptation_parameter_scope: all
  cotta_teacher_momentum: 0.999
  cotta_restore_probability: 0.01
  cotta_anchor_threshold: 0.92
  cotta_augmentations: 8

runtime:
  run_name: sdust-bearing-cotta

