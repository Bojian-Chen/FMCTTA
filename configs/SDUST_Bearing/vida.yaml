# Run: python main.py --config configs/SDUST_Bearing/vida.yaml
base: base.yaml

protocol:
  method: vida

adaptation:
  adaptation_parameter_scope: all
  vida_learning_rate: 0.00001
  vida_low_rank: 1
  vida_high_rank: 128
  vida_teacher_momentum: 0.999
  vida_adapter_momentum: 0.999
  vida_uncertainty_threshold: 0.2
  vida_uncertainty_scale: 0.1
  vida_augmentations: 10

runtime:
  run_name: sdust-bearing-vida

