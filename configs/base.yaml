# Shared settings for every PU/WT experiment. Dataset-specific settings live in
# configs/PU/base.yaml and configs/WT/base.yaml.

protocol:
  stream_batch_size: 16
  seed: 2025

data:
  # dataset and data_root are intentionally absent: dataset_manifest in each
  # dataset base supplies both the dynamic DatasetSpec and its data directory.
  normalization: none
  source_validation_ratio: 0.2
  strict_data: false
  max_source_per_class: null
  max_target_per_domain: null

model:
  model_id: bojian1/UniFreq-tiny
  model_revision: ""
  # hf_token is intentionally not stored in versioned YAML. Inject it securely
  # at runtime only when using a private Hugging Face model.
  cache_dir: ""
  local_files_only: false
  classifier: mlp
  classifier_dropout: 0.1
  source_epochs: 30
  source_batch_size: 64
  eval_batch_size: 128
  source_learning_rate: 0.01
  source_backbone_lr_scale: 0.01
  source_weight_decay: 0.0001
  source_gradient_clip: 1.0

adaptation:
  adaptation_learning_rate: 0.0001
  adaptation_weight_decay: 0.0
  adaptation_steps: 1
  adaptation_parameter_scope: default

runtime:
  device: auto
  workers: 0
  output_dir: outputs
