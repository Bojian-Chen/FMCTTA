# Run: python main.py --config configs/MCC5_motor/unifreq/note.yaml
base: base.yaml

protocol:
  method: note

adaptation:
  adaptation_learning_rate: 0.0001
  adaptation_parameter_scope: layernorm
  note_memory_size: 64
  note_update_interval: 64
  note_temperature: 1.0

runtime:
  run_name: mcc5-motor-note

