# Run: python main.py --config configs/MCC5_motor/continual_mae.yaml
base: base.yaml

protocol:
  method: continual_mae

adaptation:
  adaptation_parameter_scope: all
  continual_mae_mask_ratio: 0.5
  continual_mae_augmentations: 10
  continual_mae_reconstruction_weight: 0.5
  continual_mae_restore_probability: 0.1

runtime:
  run_name: mcc5-motor-continual-mae

